<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校竞标 · 协作工作台</title><link rel="stylesheet" href="workspace.css"></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="identity-dialog" aria-labelledby="identity-title"><div class="dialoghead"><h2 id="identity-title">演示身份</h2><button class="btn icon" id="close-identity" aria-label="关闭"><i data-lucide="x"></i></button></div><p class="muted">这里切换的是本地演示身份，不是实际登录或权限认证。不同团队仅展示自己的投标与项目记录。</p><form id="identity-form"><label class="field">端口<select name="role"><option value="merchant">商家端</option><option value="student">学生端</option><option value="admin">独立平台管理端</option><option value="school">校方端（成果概览）</option></select></label><label class="field">学生团队<select name="team"><option value="A">团队 A · 青柠创意组</option><option value="B">团队 B · 拾光影像组</option><option value="C">团队 C · 光点创作组</option></select></label><label class="field">学生成员<select name="member"><option value="0">林同学 · 负责人</option><option value="1">陈同学</option><option value="2">周同学</option><option value="3">许同学</option></select></label><button type="submit" class="btn primary">进入该身份</button></form></dialog><script src="assets/lucide.min.js"></script><script src="platform-model.js"></script><script src="transactions.js"></script><script src="centers.js"></script><script src="workspace.js"></script></body></html>
