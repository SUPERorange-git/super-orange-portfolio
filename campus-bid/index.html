<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校竞标 · 全页面设计图册</title><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.6 "Microsoft YaHei",Arial,sans-serif;color:#24352c;background:#edf1ee}button,input,select{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #117461;outline-offset:3px}.atlasbar{height:65px;display:flex;align-items:center;gap:18px;padding:0 22px;background:#20382d;color:white}.atlasbar h1{font-size:16px;margin:0;white-space:nowrap}.atlasbar small{color:#c1d1c6}.atlasbar button,.atlasbar a{background:transparent;color:white;border:1px solid #698376;padding:6px 11px;border-radius:4px;display:inline-flex;align-items:center;gap:6px}.atlasbar .right{margin-left:auto;display:flex;gap:10px}.atlaslayout{display:grid;grid-template-columns:246px minmax(0,1fr);height:calc(100vh - 65px)}.catalog{background:white;border-right:1px solid #d5dfd8;overflow:auto;padding:20px 15px}.catalog input{border:1px solid #d8e1da;border-radius:4px;width:100%;padding:9px 10px}.roles{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0}.roles button{border:1px solid #dde5de;background:#fff;padding:4px 8px;border-radius:4px;font-size:11px}.roles button.active{background:#117461;color:white;border-color:#117461}.group{margin:20px 6px 8px;font-size:11px;color:#7a877d}.screenlink{display:flex;gap:10px;padding:8px 9px;border-radius:4px;font-size:12px;margin:2px 0}.screenlink span{font-size:10px;color:#879489;min-width:25px;padding-top:2px}.screenlink.active{background:#e9f3ed;color:#12634f;font-weight:600}.preview{min-width:0;display:flex;flex-direction:column;overflow:hidden}.previewbar{height:47px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#f7f9f6;border-bottom:1px solid #dce4dc;gap:12px}.previewbar .controls{display:flex;gap:6px;align-items:center}.previewbar button{border:1px solid #d5e0d6;background:white;border-radius:4px;min-width:31px;height:29px;display:inline-grid;place-items:center}.previewbar small{color:#718073}iframe{border:0;width:100%;height:100%;background:white}.viewport{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;background:#dce4dc}.viewport.mobile iframe{max-width:390px;flex-shrink:0}.gallery{padding:25px;overflow:auto;display:none;height:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-content:start}.gallery.visible{display:grid}.thumb{background:white;border:1px solid #d5dfd7;border-radius:5px;overflow:hidden;display:block}.thumb img{width:100%;aspect-ratio:1.6;object-fit:contain;background:#f4f7f4;display:block}.thumb .label{padding:11px 15px;border-top:1px solid #e3e9e2}.thumb strong{display:block;font-size:13px}.thumb small{color:#78867c}svg{width:16px;height:16px}.hidden{display:none!important}.key{color:#617668;font-size:11px;margin:15px 6px}.selectedcount{font-size:11px;color:#779080;margin-bottom:10px}@media(max-width:800px){.atlasbar{padding:0 12px;height:auto;min-height:65px;flex-wrap:wrap;gap:8px}.atlasbar small{display:none}.atlasbar .right{gap:5px}.atlasbar button,.atlasbar a{font-size:11px;padding:5px}.atlaslayout{grid-template-columns:175px minmax(0,1fr)}.catalog{padding:12px 8px}.gallery{grid-template-columns:1fr;padding:12px}.previewbar small{display:none}.previewbar{padding:0 8px}.screenlink{font-size:11px;gap:5px}.roles button{font-size:10px}}@media(max-width:520px){.atlaslayout{display:block}.catalog{height:190px;border-bottom:1px solid #ddd}.catalog #links{display:flex;overflow:auto;gap:5px}.group{display:none}.screenlink{min-width:130px;align-items:center}.preview{height:calc(100vh - 255px)}.key,.selectedcount{display:none}.roles{margin:6px 0}.atlasbar h1{font-size:14px}.atlasbar .right{margin-left:0}}
</style></head><body><header class="atlasbar"><h1>校竞标 · 全页面设计图册</h1><small id="total"></small><div class="right"><button id="gallery-toggle"><i data-lucide="layout-grid"></i>全部界面图</button><button id="flow"><i data-lucide="route"></i>成交路径</button><a id="png" download><i data-lucide="image-down"></i>当前页 PNG</a></div></header><div class="atlaslayout"><aside class="catalog"><input id="find" placeholder="搜索页面名称或编号"><div class="roles" id="roles"></div><div class="selectedcount" id="count"></div><div id="links"></div><p class="key">商家端：克制商务，清晰可信<br>学生端：简约创意，年轻校园<br>页面为设计快照，不是真实交易</p></aside><main class="preview"><div class="previewbar"><span id="current"></span><div class="controls"><button id="prev" title="上一页"><i data-lucide="chevron-left"></i></button><small id="position"></small><button id="next" title="下一页"><i data-lucide="chevron-right"></i></button><button id="mobile" title="手机宽度预览"><i data-lucide="smartphone"></i></button><button id="open" title="独立打开当前页"><i data-lucide="external-link"></i></button></div></div><div class="viewport" id="viewport"><iframe id="frame" title="页面设计预览" src="screen.html?id=M01"></iframe></div><div class="gallery" id="gallery"></div></main></div><script src="assets/lucide.min.js"></script><script src="screens.js"></script><script>
let current='M01',role='all',flow=false,gallery=false;const $=id=>document.getElementById(id);const icons=()=>lucide.createIcons();
function filtered(){let pages=flow?FLOW.map(id=>SCREENS.find(s=>s.id===id)):SCREENS;return pages.filter(s=>(role==='all'||s.role===role)&&`${s.id} ${s.title} ${s.section}`.includes($('find').value));}
function select(id,changeFrame=true){current=id;const s=SCREENS.find(x=>x.id===id);if(!s)return;if(changeFrame)$('frame').src='screen.html?id='+id;$('current').textContent=`${s.id} · ${ROLES[s.role]} · ${s.title}`;$('png').href=`exports/${s.role}/${s.id}.png`;$('png').download=`${s.id}-${s.title}.png`;const pages=filtered();$('position').textContent=`${Math.max(0,pages.findIndex(p=>p.id===id))+1} / ${pages.length}`;document.querySelectorAll('.screenlink').forEach(a=>a.classList.toggle('active',a.dataset.id===id));location.hash=id;}
function render(){const pages=filtered();$('total').textContent=`${SCREENS.length} 张独立界面 · V1.0`;$('count').textContent=`${flow?'成交路径':'页面目录'} / ${pages.length} 页`;$('roles').innerHTML=[['all','全部'],...Object.entries(ROLES)].map(([key,label])=>`<button data-role="${key}" class="${role===key?'active':''}">${label}</button>`).join('');let last='';$('links').innerHTML=pages.map(s=>{const group=`${ROLES[s.role]} · ${s.section}`;let heading=group!==last?`<div class="group">${group}</div>`:'';last=group;return `${heading}<a class="screenlink ${current===s.id?'active':''}" data-id="${s.id}" href="#${s.id}"><span>${s.id}</span>${s.title}</a>`;}).join('');$('gallery').innerHTML=pages.map(s=>`<a class="thumb" href="#${s.id}" data-id="${s.id}"><img loading="lazy" src="exports/${s.role}/${s.id}.png" alt="${s.title}界面图"><div class="label"><strong>${s.id} · ${s.title}</strong><small>${ROLES[s.role]} / ${s.section}</small></div></a>`).join('');select(current,false);icons();}
document.addEventListener('click',e=>{const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;render();return;}const a=e.target.closest('[data-id]');if(a){e.preventDefault();select(a.dataset.id);if(a.classList.contains('thumb')){gallery=false;showGallery();}}});
function showGallery(){$('gallery').classList.toggle('visible',gallery);$('viewport').classList.toggle('hidden',gallery);}
$('gallery-toggle').onclick=()=>{gallery=!gallery;showGallery();};$('find').oninput=render;$('flow').onclick=()=>{flow=!flow;role='all';$('find').value='';render();select(flow?FLOW[0]:'M01');};
function move(d){const p=filtered();let i=p.findIndex(x=>x.id===current);if(p.length)select(p[(i+d+p.length)%p.length].id);}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('mobile').onclick=()=>$('viewport').classList.toggle('mobile');$('open').onclick=()=>window.open('screen.html?id='+current,'_blank');
window.addEventListener('message',e=>{if(e.source===$('frame').contentWindow&&e.data?.type==='screen-ready')select(e.data.id,false);});const requested=location.hash.slice(1);render();select(SCREENS.some(s=>s.id===requested)?requested:'M01');
</script><script src="hub-link.js"></script></body></html>
